<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMPODSP</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c1f26;--card:#fff;--mut:#6b7280;--ac:#2d8cff;--bd:#e3e6ec;--red:#d93a3a;--grn:#15934f;--org:#e08a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--fg:#eceef3;--card:#1e2128;--mut:#9aa1ae;--ac:#4aa3ff;--bd:#2c303a;--red:#ff6b6b;--grn:#3ccf82;--org:#ffb13b}}
:root[data-theme="dark"]{--bg:#14161b;--fg:#eceef3;--card:#1e2128;--mut:#9aa1ae;--ac:#8c70ff;--bd:#2c303a;--red:#ff6b6b;--grn:#3ccf82;--org:#ffb13b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:19px;margin:2px 0 10px}
.bnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
.bnav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 7px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.bnav button span{font-size:21px;line-height:1}
.bnav button.on{color:var(--ac);font-weight:700}
.seg{display:flex;background:var(--bd);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;color:var(--fg);padding:9px 2px;border-radius:8px;font-size:13px;cursor:pointer;position:relative}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:var(--ac);color:#fff;border-radius:14px;padding:16px;margin:8px 0}
.hero small{opacity:.85;display:block}.hero b{font-size:30px}
.big{font-size:28px;font-weight:700}
.pos{color:var(--grn)}.neg{color:var(--red)}.hero .neg{color:#ffd0d0}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.line:last-child{border-bottom:0}.line.t{font-weight:700}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:-4px 0 6px}.bar i{display:block;height:100%;background:var(--org);border-radius:3px}
.mut{color:var(--mut);font-size:13px}
details>summary{list-style:none;cursor:pointer;background:var(--ac);color:#fff;text-align:center;padding:13px;border-radius:12px;font-weight:700;margin:10px 0}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{background:var(--bd);color:var(--fg)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}
.form .w{grid-column:1/-1}
input,select{padding:11px;min-height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font-size:16px;width:100%}
.btn{background:var(--ac);color:#fff;border:0;min-height:46px;padding:0 16px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.sm{background:transparent;color:var(--ac);border:1px solid var(--bd);min-height:38px;padding:0 12px;border-radius:8px;font-size:14px;cursor:pointer}
.sm.d{color:var(--red)}.sm.g{background:var(--grn);color:#fff;border-color:var(--grn)}
.it{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border-bottom:0}
.it .l{min-width:0;flex:1}.it .r{text-align:right;font-weight:700}
.act{display:flex;gap:6px;width:100%;justify-content:flex-end;align-items:center}
.act input{width:80px;min-height:38px;padding:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bd);font-weight:400}
.tag.r{background:var(--red);color:#fff}.tag.g{background:var(--grn);color:#fff}
.empty{text-align:center;color:var(--mut);padding:18px 0}
.mes{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;cursor:pointer;color:var(--ac);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;padding:8px 4px;text-align:left}
.mes .mmeta{font-weight:400;text-transform:none;color:var(--mut);font-size:13px;white-space:nowrap}
.dcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.dhead{font-size:12px;color:var(--mut);font-weight:700;padding:7px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
.vrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd)}
.vrow:last-child{border-bottom:0}
.vl{flex:1;min-width:0}
.cli{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl .mut{font-size:12px}
.vr{text-align:right;white-space:nowrap}
.vval{font-weight:700;font-size:15px}
.vst{font-size:11px;margin-top:2px}
.vst .tag{font-size:11px;padding:1px 6px}
.vact{display:flex;gap:4px;align-items:center}
.vact .sm{min-height:30px;padding:0 8px;font-size:12px}
.x{background:none;border:0;color:var(--red);font-size:15px;cursor:pointer;min-height:30px;padding:0 4px}
.vrow{border-left:4px solid transparent}
.vrow.pg{border-left-color:var(--grn)}.vrow.ar{border-left-color:var(--org)}.vrow.vc{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 6%,transparent)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:4px 2px 2px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.invok{background:var(--grn);color:#fff;border-radius:14px;padding:14px;margin:10px 0}
.invok b{font-size:17px}
.toast{position:fixed;left:12px;right:12px;bottom:86px;background:var(--grn);color:#fff;padding:14px 16px;border-radius:12px;font-weight:700;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center}
.hero.amarelo{background:#f5c518;color:#1c1f26}
.hero.amarelo small{opacity:.8}
.hero.amarelo b{font-size:22px;display:block;margin:4px 0}
.hero.verde{background:#15934f;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--bd);border-radius:12px;padding:3px 9px;font-size:12px;font-weight:600}
.sab{display:flex;gap:6px;width:100%;margin-top:8px}
.sab input{min-height:38px;padding:6px 10px;font-size:14px}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--bd);border-radius:12px;padding:4px}
.stepper button{min-width:44px;min-height:40px;border:0;border-radius:9px;background:var(--card);color:var(--fg);font-size:18px;font-weight:700;cursor:pointer;padding:0 8px}
.stepper b{min-width:40px;text-align:center;font-size:17px}
.schip{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:20px;padding:9px 14px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer;margin:0 6px 6px 0}
.schip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.schip small{opacity:.8;font-weight:400}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.frow:last-child{border-bottom:0}
.pcard{padding:12px 0;border-bottom:1px solid var(--bd)}
.pcard:last-child{border-bottom:0}
.ptop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ptot{font-weight:700;font-size:16px;white-space:nowrap}
.pact{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;width:100%;background:none;border:0;padding:4px 0;color:var(--fg);text-align:left;cursor:pointer;font:inherit}
.chev{color:var(--ac);font-size:14px;margin-left:4px}
.vrow.hj{border-left-color:#f5c518;background:color-mix(in srgb,#f5c518 12%,transparent)}
.crow{border-left:4px solid transparent;padding-left:10px}
.crow.vc{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 6%,transparent)}
.crow.hj{border-left-color:#f5c518;background:color-mix(in srgb,#f5c518 12%,transparent)}
.stat{display:inline-block;font-size:15px;font-weight:700;padding:8px 14px;border-radius:20px;background:var(--bd);color:var(--fg);line-height:1.2}
.stat.r{background:var(--red);color:#fff}
.stat.g{background:var(--grn);color:#fff}
.cl{padding:0;overflow:hidden}
.crow{padding:12px 14px 12px 12px;border-bottom:1px solid var(--bd);border-left:4px solid transparent}
.crow:last-child{border-bottom:0}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.cnome{font-size:16px}
.cdeve{font-weight:700;font-size:15px;white-space:nowrap}
.cbot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.stat.am{background:#f5c518;color:#1c1f26}
.ccount{display:inline-block;font-size:12px;font-weight:700;background:var(--bd);color:var(--fg);padding:3px 9px;border-radius:12px;margin-left:8px;vertical-align:middle}
.vrow.lib{background:color-mix(in srgb,var(--ac) 10%,transparent)}
.libaviso{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:#7a5c00;background:#fffbe6;border:1px solid #f3e3a1;border-radius:10px;padding:2px 8px}
.alerta{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;border:1px solid;margin:4px 0 10px}
.alerta .ic{font-size:22px;line-height:1;flex:none}
.alerta b{display:block;font-size:15px;line-height:1.25}
.alerta small{display:block;font-size:13px;opacity:.85;margin-top:2px}
.alerta.red{background:color-mix(in srgb,var(--red) 14%,transparent);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.alerta.amb{background:color-mix(in srgb,#f5c518 18%,transparent);border-color:color-mix(in srgb,#f5c518 55%,transparent)}
.alerta.grn{background:color-mix(in srgb,var(--grn) 14%,transparent);border-color:color-mix(in srgb,var(--grn) 45%,transparent)}
.alerta.neu{background:var(--bd);border-color:var(--bd)}
.btn-lib{width:100%;min-height:48px;border-radius:14px;border:1.5px dashed var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:4px}
.btn-lib:active{transform:scale(.98)}
.desf{color:var(--ac);font-weight:700;text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}
.md{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:16px;padding:18px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.mdm{margin:0 0 12px;font-size:15px;line-height:1.4;white-space:pre-line}
.mdi{margin-bottom:14px}
.mdb{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.mdb .btn,.mdok{width:auto;min-width:110px}
.mdperigo{background:var(--red)}
.tagbtn{border:0;cursor:pointer;font:inherit}
.sm.wa{background:#25d366;color:#fff;border-color:#25d366;font-weight:700}
.mdta{min-height:120px;font:inherit;font-size:14px;line-height:1.4;resize:vertical;width:100%}
.vrow{padding:12px 14px;gap:12px}
.vr{margin-left:4px}
.vst{margin-top:6px}
.vact{gap:8px;align-items:center}
.vact .sm{min-height:36px;padding:0 14px;border-radius:10px;font-size:13px}
.sm.wa{background:color-mix(in srgb,#25d366 14%,transparent);color:#1fa855;border:1px solid #25d366;font-weight:700}
.sm.g{font-weight:700}
.x{min-height:36px;padding:0 6px}
.vrow{flex-wrap:wrap}
.vact{flex:1 1 100%;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.dcard{overflow:visible}
.cob{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:20px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.cob-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cob-av{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.cob-nome{font-weight:700;font-size:16px}
.cob-tel{font-size:13px;color:var(--mut)}
.cob-x{margin-left:auto;background:var(--bd);border:0;border-radius:50%;width:32px;height:32px;color:var(--fg);cursor:pointer;font-size:13px}
.cob-sec{margin-bottom:14px}
.cob-lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:6px}
.cob-num{width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.cob-hint{font-weight:400;color:var(--mut);font-size:12px}
.cob-ta{width:100%;min-height:150px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;line-height:1.5;resize:vertical}
.cob-ta-pix{min-height:44px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.cob-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cob-btn{min-height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-weight:600;font-size:14px;cursor:pointer}
.cob-btn:active{transform:scale(.98)}
.cob-open{display:block;text-align:center;min-height:50px;line-height:50px;border-radius:14px;background:#1fa855;color:#fff;font-weight:700;font-size:15px;text-decoration:none;margin-bottom:12px}
.cob-foot{margin:0;font-size:12px;color:var(--mut);text-align:center}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;flex:none;object-fit:contain}

/* ===== MODELO 4: escuro neon moderno (só aparência) ===== */
:root:root{
  --bg:#05060b; --fg:#e8f7ff; --card:#0b0f1a; --mut:#6b7a94; --ac:#3b82ff;
  --bd:rgba(80,160,255,.18); --red:#ff3d6e; --grn:#39ff88; --org:#ffc13b;
  color-scheme:dark;
}
body{background:
  radial-gradient(700px 380px at 90% -10%,rgba(59,130,255,.22),transparent 60%),
  radial-gradient(600px 360px at -10% 40%,rgba(57,255,136,.12),transparent 60%),
  linear-gradient(rgba(80,160,255,.05) 1px,transparent 1px) 0 0/100% 32px,
  linear-gradient(90deg,rgba(80,160,255,.05) 1px,transparent 1px) 0 0/32px 100%,
  var(--bg);
  color:var(--fg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
main{max-width:580px;padding:22px 14px 120px}
h1{font-size:20px;font-weight:800;letter-spacing:.02em;margin:6px 0 16px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
h1 span{font-size:10px;letter-spacing:.2em;font-weight:700;background:linear-gradient(90deg,#39ff88,#3b82ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px;box-shadow:0 0 24px -12px rgba(59,130,255,.5)}
.seg button{border-radius:10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:9px 2px;background:transparent}
.seg button.on{background:linear-gradient(135deg,rgba(59,130,255,.35),rgba(57,255,136,.25));color:#fff;box-shadow:0 0 18px -4px rgba(57,255,136,.55),inset 0 0 0 1px rgba(120,220,255,.35)}
.card,.cl{background:linear-gradient(180deg,rgba(14,20,34,.9),rgba(8,11,20,.9));border:1px solid var(--bd);border-radius:16px;padding:6px 16px;margin:12px 0;box-shadow:0 0 28px -18px rgba(59,130,255,.6)}
.hero{border-radius:18px;padding:22px 20px;margin:10px 0;background:linear-gradient(135deg,rgba(59,130,255,.25),rgba(12,18,34,.95) 60%);border:1px solid rgba(59,130,255,.45);box-shadow:0 0 40px -10px rgba(59,130,255,.6),inset 0 0 40px -20px rgba(59,130,255,.5)}
.hero.verde{background:linear-gradient(135deg,rgba(57,255,136,.22),rgba(6,16,12,.95) 60%);border-color:rgba(57,255,136,.55);box-shadow:0 0 44px -10px rgba(57,255,136,.55),inset 0 0 40px -20px rgba(57,255,136,.5)}
.hero.amarelo{background:linear-gradient(135deg,rgba(255,193,59,.22),rgba(16,12,4,.95) 60%);border-color:rgba(255,193,59,.5);box-shadow:0 0 40px -12px rgba(255,193,59,.5)}
.hero small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.hero b{font-size:40px;font-weight:800;letter-spacing:-.02em;text-shadow:0 0 22px rgba(120,220,255,.45)}
.invok{background:linear-gradient(135deg,rgba(57,255,136,.18),rgba(6,16,12,.9));border:1px solid rgba(57,255,136,.5);border-radius:16px;color:var(--fg);box-shadow:0 0 30px -12px rgba(57,255,136,.6)}
.line{border-bottom:1px solid rgba(80,160,255,.1);padding:12px 0;font-size:14px}
.line:last-child{border-bottom:0}
.line.t{font-weight:800}
.bar{background:rgba(80,160,255,.12);height:6px;border-radius:6px}
.bar i{background:linear-gradient(90deg,#3b82ff,#39ff88);border-radius:6px;box-shadow:0 0 10px rgba(57,255,136,.6)}
.mes{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7fb2ff;font-weight:800;padding:16px 2px 6px;margin:10px 0 0;text-shadow:0 0 14px rgba(59,130,255,.5)}
.mes .mmeta{color:var(--mut);text-shadow:none;font-weight:600;letter-spacing:.02em;text-transform:none;font-size:12px}
.dcard{background:transparent;border:0;margin:0 0 4px;overflow:visible;box-shadow:none}
.dhead{background:transparent;border:0;color:#39ff88;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:10px 2px 2px;font-weight:800;opacity:.85}
.vrow{background:linear-gradient(90deg,rgba(14,20,34,.95),rgba(8,11,20,.9));border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:6px 0;border-left:3px solid var(--mut);box-shadow:0 0 22px -18px rgba(59,130,255,.7)}
.vrow.pg{border-left-color:var(--grn);box-shadow:0 0 22px -14px rgba(57,255,136,.6)}
.vrow.ar{border-left-color:var(--org)}
.vrow.hj{border-left-color:#ffe066;box-shadow:0 0 22px -12px rgba(255,224,102,.6)}
.vrow.vc{border-left-color:var(--red);box-shadow:0 0 24px -12px rgba(255,61,110,.7);background:linear-gradient(90deg,rgba(255,61,110,.08),rgba(8,11,20,.9))}
.vrow.lib{background:linear-gradient(90deg,rgba(59,130,255,.12),rgba(8,11,20,.9))}
.cli{font-size:15px;font-weight:700}
.vval{font-size:15px;font-weight:800;color:#e8f7ff}
.mut,.vl .mut{color:var(--mut);font-size:12.5px}
.vact{gap:6px}
.vact .sm{min-height:32px;border-radius:999px;padding:0 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;border:0;background:rgba(255,255,255,.06);color:var(--fg)}
.vact .sm.g{background:linear-gradient(135deg,#3b82ff,#39ff88);color:#03110a;box-shadow:0 0 16px -4px rgba(57,255,136,.7)}
.sm.wa{background:rgba(57,255,136,.1);color:var(--grn);border:1px solid rgba(57,255,136,.45)}
.sm.d{background:transparent;color:var(--red);border:0}
.x{color:var(--red);min-height:32px;opacity:.8}
.sm{border-radius:999px;background:rgba(255,255,255,.05);color:var(--fg);border:1px solid var(--bd)}
.tag{border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;background:rgba(255,255,255,.06);color:var(--mut)}

.enter .vr2:nth-child(3),.enter .cl-row:nth-child(3),.enter .pcard:nth-child(3){animation-delay:80ms}
.enter .vr2:nth-child(4),.enter .cl-row:nth-child(4),.enter .pcard:nth-child(4){animation-delay:120ms}

.vr2,.cl-row,.pcard{content-visibility:auto;contain-intrinsic-size:auto 96px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.home-link span:last-child{font-size:20px;color:var(--mut)}
.home-alert{width:100%;margin:0 0 12px}
@media(max-width:480px){
 .home-heading{margin-top:2px;margin-bottom:13px}
 .home-heading-title{font-size:20px}
 .home-heading-icon{width:36px;height:36px}
 .home-resumo{padding:16px 15px 5px}
 .home-valor{font-size:30px}
 .home-metricas{column-gap:14px}
 .home-metrica{padding:12px 0}
 .home-metrica b{font-size:14px}
 .home-invest{padding:14px 15px}
}


/* Refinos de hierarquia e ações do painel */
.home-resumo{box-shadow:0 10px 28px rgba(0,0,0,.08)}
.home-metricas{gap:0 14px}
.home-metrica{position:relative;padding:13px 12px 13px 0}
.home-metrica:nth-child(odd){padding-right:12px}
.home-metrica:nth-child(even){padding-left:12px;border-left:1px solid rgba(125,155,205,.08)}
.home-metrica span{letter-spacing:.01em}
.home-metrica b{display:block;margin-top:2px;font-variant-numeric:tabular-nums}
.home-alert{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,184,77,.18);background:rgba(255,184,77,.07);color:inherit;cursor:pointer}
.home-alert-stock{border-color:rgba(101,245,173,.15);background:rgba(101,245,173,.055)}
.home-alert-icon{flex:0 0 30px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,184,77,.13);color:#ffbf66;font-size:17px;font-weight:800}
.home-alert-stock .home-alert-icon{background:rgba(101,245,173,.12);color:#65f5ad}
.home-alert-text{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px}
.home-alert-text b{font-size:12px}
.home-alert-text small{font-size:11px;color:var(--mut);line-height:1.4}
.home-arrow{font-size:22px;color:var(--mut)}
.home-link{transition:background .15s ease;padding-left:9px;padding-right:9px;border-radius:10px}
.home-link:active{background:rgba(125,155,205,.08)}
@media(max-width:480px){
 .home-metricas{column-gap:0}
 .home-metrica{padding-top:12px;padding-bottom:12px}
 .home-metrica:nth-child(odd){padding-right:8px}
 .home-metrica:nth-child(even){padding-left:10px}
 .home-alert{padding:12px}
}


/* Ação principal do painel */
.home-quick-sale{display:flex;align-items:center;gap:12px;width:100%;margin:15px 0 7px;padding:14px;text-align:left;border:1px solid rgba(101,245,173,.22);border-radius:15px;background:linear-gradient(110deg,rgba(101,245,173,.12),rgba(101,245,173,.045));color:var(--fg);cursor:pointer}
.home-quick-icon{flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:#65f5ad;color:#10251b;font-size:25px;font-weight:500}
.home-quick-sale>span:nth-child(2){display:flex;flex:1;min-width:0;flex-direction:column;gap:4px}
.home-quick-sale b{font-size:13px;font-weight:750}
.home-quick-sale small{font-size:11px;color:var(--mut);line-height:1.4}
.home-quick-arrow{font-size:23px;color:#65f5ad}
.home-quick-sale:active{transform:scale(.99)}
@media(max-width:480px){.home-quick-sale{padding:12px;margin-top:12px}}

/* Seleção de pagamento em botões responsivos */
.vs-pagamento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:2px}
.vs-pagamento-btn{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;padding:13px 12px;border:1px solid var(--line,rgba(125,155,205,.18));border-radius:13px;background:rgba(125,155,205,.035);color:var(--fg);text-align:left;cursor:pointer;transition:border-color .16s,background .16s,transform .16s}
.vs-pagamento-btn>span:nth-child(2){font-size:13px;font-weight:750}
.vs-pagamento-btn small{font-size:10px;color:var(--mut);line-height:1.35}
.vs-pagamento-icone{display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:rgba(125,155,205,.10);font-size:16px;color:var(--mut)}
.vs-pagamento-btn.active{border-color:rgba(101,245,173,.58);background:rgba(101,245,173,.085);box-shadow:inset 0 0 0 1px rgba(101,245,173,.08)}
.vs-pagamento-btn.active .vs-pagamento-icone{background:#65f5ad;color:#10251b}
.vs-pagamento-btn.active>span:nth-child(2){color:#65f5ad}
.vs-pagamento-btn:active{transform:scale(.985)}
@media(max-width:380px){.vs-pagamento{gap:7px}.vs-pagamento-btn{padding:11px 9px}}
/* Microinterações premium */
.home-resumo{animation:none}.home-invest{animation:none}.home-progress i{transition:width .9s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 12px rgba(101,245,173,.24)}
.home-alert{animation:cardReveal .38s ease both;transition:transform .18s,border-color .18s,background .18s}.home-alert:active{transform:scale(.99)}
.home-quick-sale{transition:transform .18s,border-color .18s,background .18s;animation:cardReveal .5s ease both;animation-delay:.1s}.home-quick-sale:hover{border-color:rgba(101,245,173,.45);background:linear-gradient(110deg,rgba(101,245,173,.16),rgba(101,245,173,.06))}
.toast{display:flex;align-items:center;justify-content:center;gap:9px;animation:toastIn .32s cubic-bezier(.2,.8,.2,1) both}
  .pcard,.cl-row,.vr2,.ch-row,.frow{transition:opacity .2s ease,transform .2s ease,filter .2s ease}
  .pcard.editado,.cl-row.editado,.vr2.editado,.ch-row.editado,.frow.editado{animation:registroEditado .42s ease}
  @keyframes registroEditado{0%{filter:brightness(1)}35%{filter:brightness(1.35);transform:translateY(-2px)}100%{filter:brightness(1);transform:translateY(0)}}
  .removendo{opacity:0!important;transform:translateX(14px) scale(.98)!important;filter:blur(2px);pointer-events:none!important}
  .toast::before{content:'✓';display:grid;place-items:center;flex:0 0 24px;width:24px;height:24px;border:2px solid rgba(255,255,255,.8);border-radius:50%;font-size:14px;animation:checkPop .35s .08s cubic-bezier(.2,.8,.2,1) both}.toast.saindo{animation:toastOut .2s ease both}
.ov{animation:overlayIn .18s ease both}.md{animation:modalIn .22s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardReveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes toastIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}@keyframes checkPop{from{opacity:0;transform:scale(.4) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes overlayIn{from{opacity:0}to{opacity:1}}@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Medidor semicircular de recuperação do investimento */
.home-invest{padding:18px;background:linear-gradient(145deg,rgba(13,22,35,.96),rgba(8,13,23,.94));border:1px solid rgba(125,155,205,.18);border-radius:18px}
.home-score-wrap{display:flex;align-items:center;gap:14px}
.home-score-ring{flex:0 0 154px;width:154px;height:100px;position:relative;animation:none;overflow:visible}
.home-score-ring svg{display:block;width:100%;height:100%;overflow:visible}
.home-score-track{fill:none;stroke:rgba(125,155,205,.13);stroke-width:12;stroke-linecap:round}
.home-score-progress{fill:none;stroke:url(#scoreGradient);stroke-width:12;stroke-linecap:round;stroke-dasharray:var(--score) 100;transition:stroke-dasharray 1.15s cubic-bezier(.22,.75,.25,1)}
.home-score-dot{fill:var(--score-color);stroke:#0b1220;stroke-width:3;filter:drop-shadow(0 0 5px var(--score-color));transition:cx 1.15s cubic-bezier(.22,.75,.25,1),cy 1.15s cubic-bezier(.22,.75,.25,1)}
.home-score-number{font-size:21px;font-weight:850;letter-spacing:-.04em;fill:var(--score-color);text-anchor:middle}
.home-score-caption{font-size:7px;letter-spacing:1.1px;fill:var(--mut);font-weight:750;text-anchor:middle}
.home-score-info{flex:1;min-width:0}
.home-score-amount{margin-top:9px;overflow-wrap:anywhere}
.home-score-amount b{font-size:18px;color:var(--fg)}
.home-score-amount span{font-size:11px;color:var(--mut)}
.home-score-missing{font-size:11px;color:var(--mut);margin-top:6px}
.home-score-missing b{color:#ffd166}
.home-score-done{font-size:11px;color:#65f5ad;margin-top:7px;font-weight:700}
@keyframes scoreAppear{from{opacity:.25;transform:translateY(5px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:420px){.home-invest{padding:14px}.home-score-wrap{gap:8px}.home-score-ring{flex-basis:138px;width:138px;height:94px}.home-score-number{font-size:19px}.home-score-amount b{font-size:16px}}

/* Confirmação de venda em tela cheia, com check animado */
.sale-success-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(3,8,16,.84);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);animation:saleOverlayIn .22s ease both}
.sale-success-card{width:min(100%,370px);padding:32px 24px 25px;text-align:center;border-radius:26px;background:linear-gradient(155deg,#111e2e,#09111d);border:1px solid rgba(101,245,173,.22);box-shadow:0 25px 90px rgba(0,0,0,.42);animation:saleCardIn .45s cubic-bezier(.18,.85,.25,1.2) both;position:relative;overflow:hidden}
.sale-success-card:before{content:'';position:absolute;left:-30%;right:-30%;top:-85px;height:170px;background:radial-gradient(ellipse,rgba(101,245,173,.17),transparent 68%);pointer-events:none}
.sale-success-icon{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:rgba(101,245,173,.1);border:1px solid rgba(101,245,173,.22);position:relative;animation:saleIconPop .48s .08s cubic-bezier(.18,.85,.25,1.3) both}
.sale-success-icon svg{width:54px;height:54px;overflow:visible}
.sale-success-icon circle{stroke:#65f5ad;stroke-width:2;stroke-dasharray:157;stroke-dashoffset:157;animation:saleCircle .55s .22s ease-out forwards}
.sale-success-icon path{fill:none;stroke:#65f5ad;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:saleCheck .35s .62s ease-out forwards}
.sale-success-kicker{font-size:10px;font-weight:800;letter-spacing:.18em;color:#65f5ad;text-transform:uppercase}
.sale-success-title{font-size:25px;font-weight:850;letter-spacing:-.04em;margin:8px 0 7px;color:#f5f8ff}
.sale-success-desc{font-size:13px;line-height:1.5;color:#aab7ca;margin:0 auto;max-width:260px}
.sale-success-total{font-size:27px;font-weight:850;letter-spacing:-.04em;color:#65f5ad;margin:18px 0 20px;animation:saleTotalIn .4s .35s both}
.sale-success-close{width:100%;border:0;border-radius:13px;padding:13px 16px;background:#65f5ad;color:#07140e;font-size:13px;font-weight:850;cursor:pointer;transition:transform .15s,filter .15s}
.sale-success-close:active{transform:scale(.98);filter:brightness(.94)}
.sale-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sale-confetti i{position:absolute;top:-12px;width:6px;height:10px;border-radius:2px;background:#65f5ad;animation:confettiFall 1.6s ease-in forwards}
.sale-confetti i:nth-child(3n){background:#f6cb68}.sale-confetti i:nth-child(3n + 1){background:#7fb5ff}.sale-confetti i:nth-child(1){left:8%;animation-delay:.08s}.sale-confetti i:nth-child(2){left:19%;animation-delay:.24s}.sale-confetti i:nth-child(3){left:31%;animation-delay:.02s}.sale-confetti i:nth-child(4){left:43%;animation-delay:.18s}.sale-confetti i:nth-child(5){left:57%;animation-delay:.1s}.sale-confetti i:nth-child(6){left:69%;animation-delay:.28s}.sale-confetti i:nth-child(7){left:81%;animation-delay:.04s}.sale-confetti i:nth-child(8){left:92%;animation-delay:.2s}
@keyframes saleOverlayIn{from{opacity:0}to{opacity:1}}
@keyframes saleCardIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes saleIconPop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes saleCircle{to{stroke-dashoffset:0}}@keyframes saleCheck{to{stroke-dashoffset:0}}
@keyframes saleTotalIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes confettiFall{0%{transform:translateY(-5px) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(420px) rotate(520deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.sale-success-overlay,.sale-success-card,.sale-success-icon,.sale-success-icon circle,.sale-success-icon path,.sale-success-total,.sale-confetti i,.home-score-ring{animation:none!important}.sale-success-icon circle,.sale-success-icon path{stroke-dashoffset:0}}
</style>

<script>
const $=s=>document.querySelector(s);
let S={p:[],c:[],v:[],d:[]},tab='painel',per='mes',sub='res',ST=null,REMOTE=false,READY=false;
const KEY={produtos:'p',clientes:'c',vendas:'v',gastos:'d'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const v=id=>{const el=$('#'+id);return el?el.value:''};
const n=id=>parseFloat(String(v(id)).replace(',','.'))||0;
const TABS=[['painel','⌂','Painel'],['vendas','↗','Vendas'],['produtos','▦','Produtos'],['clientes','♙','Clientes'],['gastos','−','Gastos']];
const CATS=['Divulgação','Frete/Envio','Taxas','Aluguel/Contas','Equipamento (investimento)','Outros'];
const cli=id=>(S.c.find(x=>x.id===id)||{}).nome||'Avulso';

// ---- camada de dados: banco compartilhado (remoto) ou local (fallback) ----
const local={
  set(c,id,d){const a=S[KEY[c]];const i=a.findIndex(x=>x.id===id);const o={id,...d};i<0?a.push(o):a[i]=o;saveLocal();render()},
  upd(c,id,d){const x=S[KEY[c]].find(x=>x.id===id);if(x)Object.assign(x,d);saveLocal();render()},
  del(c,id){S[KEY[c]]=S[KEY[c]].filter(x=>x.id!==id);saveLocal();render()}
};
function saveLocal(){try{localStorage.setItem('pods',JSON.stringify(S))}catch(e){}}
function remoteStore(db){return{
  set:(c,id,d)=>db.collection(c).doc(id).set(d),
  upd:(c,id,d)=>db.collection(c).doc(id).update(d),
  del:(c,id)=>db.collection(c).doc(id).delete()}}
async function run(fn){try{await fn();return true}catch(e){alert('Não foi possível salvar. '+(e&&e.message?e.message:'Tente de novo.'));return false}}


async function delP(id){if(!confirm('Excluir produto?'))return;await run(()=>ST.del('produtos',id))}
async function repor(id){const q=n('r'+id);const p=S.p.find(x=>x.id===id);if(p&&q)await run(()=>ST.upd('produtos',id,{est:p.est+q}))}







async function addD(){const val=n('dv');if(val<=0)return;await run(()=>ST.set('gastos',uid(),{data:v('dd')||hoje(),desc:v('dn').trim(),cat:v('dc'),valor:val}))}
async function delD(id){await run(()=>ST.del('gastos',id))}

// importa o que estava salvo só neste aparelho para o banco compartilhado

const IMPORT_CARD=()=>{
  if(!REMOTE)return`<div class="card" style="border-left:4px solid var(--org)"><b>Modo local</b><div class="mut">Os dados estão só neste aparelho. Entre na sua conta do Claude para compartilhar com seu amigo.</div></div>`;
  try{const o=JSON.parse(localStorage.getItem('pods')||'null');if(!o)return''
    return`<div class="card" style="border-left:4px solid var(--org)"><b>Dados deste aparelho</b><div class="mut">Há dados salvos só neste aparelho.</div><div style="margin-top:8px"><button class="btn" onclick="importLocal()">Importar para o banco compartilhado</button></div></div>`}catch(e){return''}
};

function setTab(t){tab=t;render();scrollTo(0,0)}
function setPer(p){per=p;render()}
function setSub(s){sub=s;render()}


function animarConfirmacao(dados){
  const anterior=document.querySelector('.sale-success-overlay');if(anterior)anterior.remove();
  const overlay=document.createElement('div');overlay.className='sale-success-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label',dados.titulo||'Operação concluída');
  const confete=dados.confete===false?'': '<div class="sale-confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  const total=dados.valor?'<div class="sale-success-total">'+esc(dados.valor)+'</div>':'';
  overlay.innerHTML=`<div class="sale-success-card">${confete}<div class="sale-success-icon" aria-hidden="true"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" fill="none"></circle><path d="M15 29l9 9 18-20"></path></svg></div><div class="sale-success-kicker">${esc(dados.kicker||'Tudo certo!')}</div><div class="sale-success-title">${esc(dados.titulo||'Concluído!')}</div><p class="sale-success-desc">${esc(dados.descricao||'A operação foi concluída com sucesso.')}</p>${total}<button class="sale-success-close" type="button">${esc(dados.botao||'Continuar')}</button></div>`;
  const fechar=()=>{overlay.remove();document.removeEventListener('keydown',tecla)};
  const fecharFora=e=>{if(e.target===overlay)fechar()};overlay.addEventListener('click',fecharFora);
  const tecla=e=>{if(e.key==='Escape')fechar()};document.addEventListener('keydown',tecla);
  overlay.querySelector('.sale-success-close').addEventListener('click',fechar);
  document.body.appendChild(overlay);const btn=overlay.querySelector('.sale-success-close');if(btn)btn.focus();
}
function animarVendaSucesso(dados){
  const item=(dados.q===1?'1 unidade':dados.q+' unidades')+' de '+dados.nome;
  animarConfirmacao({kicker:'Tudo certo!',titulo:'Venda registrada',descricao:item+' foi registrada com sucesso.',valor:R(dados.total),botao:'Continuar'});
}

function avisar(msg){
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('SMPODSP',{body:msg})}catch(e){}
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  const fechar=()=>{if(!t.isConnected)return;t.classList.add('saindo');setTimeout(()=>t.remove(),220)};
  setTimeout(fechar,4200);t.addEventListener('click',fechar,{once:true});
}
function checkInvest(I){
  const K='smp_inv_ok';const prev=localStorage.getItem(K);
  if(prev===null){localStorage.setItem(K,I.ok?'1':'0');return}
  if(I.ok&&prev!=='1'){localStorage.setItem(K,'1');avisar('🎉 Investimento recuperado! Você já recebeu '+R(I.rec)+' em vendas.')}
  else if(!I.ok&&prev==='1'){localStorage.setItem(K,'0')}
}
function pedirAviso(){if('Notification' in window)Notification.requestPermission().then(()=>render())}

function investCard(){
  const I=investInfo();checkInvest(I);
  const pedir=('Notification' in window&&Notification.permission==='default')?`<button type="button" class="ic-aviso" onclick="pedirAviso()">🔔 Me avisar quando recuperar</button>`:'';
  if(I.ok)return `<div class="invok"><b>🎉 Investimento recuperado!</b><div>Você já recebeu ${R(I.rec)} do que colocou nos produtos${I.dataRec?' · em '+fd(I.dataRec):''}.</div></div>`;
  return `<div class="card ic">
    <div class="ic-top"><span class="ic-titulo">Quanto já voltou do que investiu</span><span class="ic-pct">${I.pct}%</span></div>
    <div class="bar ic-bar"><i style="width:${I.pct}%"></i></div>

function diasAtraso(venc){

function diasEntre(a,b){
  const [a1,a2,a3]=a.split('-').map(Number);const [b1,b2,b3]=b.split('-').map(Number);
  return Math.round((Date.UTC(b1,b2-1,b3)-Date.UTC(a1,a2-1,a3))/86400000);
}
function vcStatus(cid){
  if(!cid)return{tipo:'avulso'};
  const tol=tolerancia(cid);
  const vs=S.v.filter(x=>x.cid===cid&&x.prazo);
  const atrasados=vs.filter(x=>!x.pago&&x.venc&&x.venc<hoje());
  if(atrasados.some(x=>diasEntre(x.venc,hoje())>tol))return{tipo:'atraso',tol};
  if(atrasados.length)return{tipo:'tolerancia',tol};
  if(vs.some(x=>x.pago&&x.dpag&&x.venc&&diasEntre(x.venc,x.dpag)>tol))return{tipo:'semcredito',tol};
  if(vs.some(x=>x.pago&&x.dpag&&x.venc&&x.dpag<=x.venc))return{tipo:'credito',tol};
  return{tipo:'novo',tol};
}

function investInfo(){
  const inv=S.p.reduce((s,p)=>{const vend=S.v.filter(x=>x.pid===p.id).reduce((a,x)=>a+x.q,0);return s+(+p.custo||0)*((+p.est||0)+vend)},0);
  const eventos=[];
  for(const x of S.v){
    if(x.pagamentos&&x.pagamentos.length)x.pagamentos.forEach(p=>eventos.push({v:+p.valor||0,d:p.data||x.data}));
    else if(x.pago)eventos.push({v:x.q*x.preco,d:x.dpag||x.data});
  }
  eventos.sort((a,b)=>String(a.d).localeCompare(String(b.d)));
  let acc=0,dataRec='';
  for(const e of eventos){acc+=e.v;if(!dataRec&&inv>0&&acc>=inv)dataRec=e.d}
  const rec=eventos.reduce((s,e)=>s+e.v,0);
  const qtd=S.v.reduce((s,x)=>s+x.q,0),tot=S.v.reduce((s,x)=>s+x.q*x.preco,0);
  const ticket=qtd?tot/qtd:(S.p.length?S.p.reduce((s,x)=>s+(+x.preco||0),0)/S.p.length:0);
  const falta=Math.max(0,inv-rec);
  const pods=ticket>0&&falta>0?Math.ceil(falta/ticket):0;
  return{inv,rec,ok:inv>0&&rec>=inv,dataRec,pct:inv?Math.min(100,Math.round(rec/inv*100)):0,ticket,falta,pods};
}

/* ---- diálogos dentro do app (funcionam mesmo quando o navegador bloqueia confirm/prompt) ---- */
function modal(opts){
  return new Promise(res=>{
    const ov=document.createElement('div');
    ov.className='ov';
    const temInput=!!opts.input;
    ov.innerHTML=`<div class="md" role="dialog"><p class="mdm">${esc(opts.msg||'')}</p>${temInput?`<input class="mdi" id="mdi" value="${esc(opts.valor||'')}" inputmode="${opts.inputmode||'text'}" autocomplete="off">`:''}<div class="mdb">${opts.cancel?`<button type="button" class="sm" id="mdc">${esc(opts.cancel)}</button>`:''}<button type="button" class="btn mdok ${opts.danger?'mdperigo':''}" id="mdo">${esc(opts.ok||'OK')}</button></div></div>`;
    document.body.appendChild(ov);
    const fechar=val=>{ov.remove();res(val)};
    ov.querySelector('#mdo').onclick=()=>fechar(temInput?ov.querySelector('#mdi').value:true);
    const c=ov.querySelector('#mdc');if(c)c.onclick=()=>fechar(temInput?null:false);
    ov.onclick=e=>{if(e.target===ov)fechar(temInput?null:false)};
    if(temInput)setTimeout(()=>{const i=ov.querySelector('#mdi');if(i){i.focus();i.select()}},50);
  });
}
function confirmar(msg,perigo){return modal({msg,ok:perigo?'Excluir':'Confirmar',cancel:'Cancelar',danger:!!perigo}).then(r=>r===true)}
function pedirValor(msg,def){return modal({msg,input:true,valor:def,ok:'Confirmar',cancel:'Cancelar',inputmode:msg.startsWith('Quanto foi pago')?'decimal':'text'})}

async function pagarVenda(id){
  const x=S.v.find(a=>a.id===id);if(!x)return;
  const saldo=saldoDe(x);
  const r=await pedirValor('Quanto foi pago agora? Falta R$ '+fmtNum(saldo)+'. Coloque o valor total para quitar.',fmtNum(saldo));
  if(r===null)return;
  let val=parseFloat(String(r).replace(',','.'));
  if(!(val>0))return alert('Informe um valor maior que zero.');
  if(val>saldo)val=saldo;
  const pags=(x.pagamentos&&x.pagamentos.length)?x.pagamentos.slice():(x.pago?[{valor:x.q*x.preco,data:x.dpag||x.data}]:[]);
  pags.push({valor:val,data:hoje()});
  const quitado=Math.max(0,x.q*x.preco-pags.reduce((s,p)=>s+(+p.valor||0),0))<0.005;
  await run(()=>ST.upd('vendas',x.id,{pagamentos:pags,pago:quitado,dpag:quitado?hoje():''}));
}

async function addSab(pid){

  const nome=((await pedirValor('Nome do sabor (ex: Morango)',''))||'').trim();if(!nome)return;
  const L=norm(p);
  if(L.some(f=>f.nome.toLowerCase()===nome.toLowerCase()))return alert('Esse sabor já existe neste produto.');
  let novoEst=0;
  if(!L.length&&p.est>0){

    novoEst=p.est;
  }

async function importLocal(){

  if(!old)return;

async function addV(){
  const p=S.p.find(x=>x.id===VS.pid);const q=VS.q;
  if(!p||q<=0)return alert('Escolha um produto.');
  const valorCliente=v('vc');const cid=valorCliente==='avulso'?'':valorCliente;const prazo=v('vf')==='prazo';
  let liberado=false;
  if(prazo){
    if(!cid)return alert('Venda a prazo precisa de um cliente cadastrado.');
    if(bloqueadoPrazo(cid)){
      if(!VLIB)return alert('Este cliente não pode comprar a prazo no momento. Use "Liberar prazo" se quiser fazer mesmo assim.');
      liberado=true;
    }
  }
  const L=norm(p);const sab=L.length?VS.sab:'';
  const it=sab?L.find(x=>x.nome===sab):null;
  if(L.length&&!it)return alert('Escolha o sabor.');
  const disp=it?it.est:p.est;
  if(q>disp&&!(await confirmar('Estoque insuficiente'+(it?' do sabor '+it.nome:'')+' ('+disp+'). Registrar mesmo assim?')))return;
  const total=q*n('vv');
  const jaPago=prazo?Math.min(total,Math.max(0,n('vpg'))):total;
  const pagamentos=jaPago>0?[{valor:jaPago,data:hoje()}]:[];
  const quitado=jaPago>=total-0.005;
  const novos=it?L.map(x=>x.nome===sab?{nome:x.nome,est:x.est-q}:x):null;
  const salvou=await run(async()=>{
    await ST.set('vendas',uid(),{data:hoje(),cid,pid:p.id,nome:p.nome,sabor:sab,q,preco:n('vv'),custo:p.custo,prazo,venc:prazo?v('vd'):'',pago:quitado,dpag:quitado?hoje():'',pagamentos,liberado});
    const upd={est:p.est-q};if(novos){upd.sabores=novos;upd.est=novos.reduce((s,f)=>s+f.est,0)}
    await ST.upd('produtos',p.id,upd);
  });
  if(salvou){VS.q=1;VLIB=false;FORM.venda=false;animarVendaSucesso({total,q,nome:p.nome});}
}

function copiarTexto(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(txt).then(()=>true,()=>copiarFallback(txt));
  }
  return Promise.resolve(copiarFallback(txt));
}
function copiarFallback(txt){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(e){ok=false}
  ta.remove();return ok;
}

function planoRecuperar(falta){
  const itens=S.p.filter(p=>(+p.est||0)>0&&(+p.preco||0)>0).slice().sort((a,b)=>b.preco-a.preco);
  let restante=falta;const plano=[];
  for(const p of itens){
    if(restante<=0.005)break;
    const precisa=Math.ceil(restante/p.preco-1e-9);
    const qtd=Math.min(p.est,precisa);
    if(qtd>0){plano.push({nome:p.nome,qtd,preco:p.preco});restante-=qtd*p.preco}
  }
  return{plano,faltaApos:Math.max(0,restante),unidades:plano.reduce((s,x)=>s+x.qtd,0)};
}

function rowVenda(x){
  const hj=hoje();
  const rec=recebidoDe(x),saldo=saldoDe(x);
  const parcial=!x.pago&&rec>0&&saldo>0.005;
  const vencida=!x.pago&&x.venc&&x.venc<hj;
  const venceHoje=!x.pago&&x.venc&&x.venc===hj;
  const cls=x.pago?'':(vencida?'vc':(venceHoje?'hj':''));
  let status,tom;
  if(x.pago){status='Pago';tom='ok'}
  else if(parcial){status=`Falta ${R(saldo)} · venc. ${fd(x.venc)}`;tom=vencida?'bad':'warn'}
  else if(vencida){status=`Vencido · ${fd(x.venc)}`;tom='bad'}
  else if(venceHoje){status='Vence hoje';tom='warn'}
  else {status=`A receber · ${fd(x.venc)}`;tom='mut'}
  const sab=x.sabor?' · '+esc(x.sabor):'';
  const lib=x.liberado?' · prazo liberado':'';
  const zapTel=(()=>{const c=S.c.find(a=>a.id===x.cid);return !!waNumero(c&&c.tel)})();
  const cobrar=(!x.pago&&zapTel)?`<button class="sm wa" onclick="cobrarWhats('${x.id}')">Cobrar</button>`:'';
  const receber=x.pago?'':`<button class="sm g" onclick="pagarVenda('${x.id}')">${parcial?'Pagar resto':'Receber'}</button>`;
  return `<div class="vr2 ${cls}" data-venda-id="${esc(x.id)}">
    <div class="vr2-main">
      <div><div class="vr2-cli">${esc(cli(x.cid))}</div><div class="vr2-sub">${x.q}× ${esc(x.nome)}${sab}${lib}</div></div>
      <div class="vr2-val">${R(x.q*x.preco)}</div>
    </div>
    <div class="vr2-foot">
      ${x.pago?`<button class="vr2-status ok tagbtn" onclick="verPag('${x.id}')">Pago ›</button>`:(parcial?`<button class="vr2-status ${tom} tagbtn" onclick="verPag('${x.id}')">${status} ›</button>`:`<span class="vr2-status ${tom}">${status}</span>`)}
      <div class="vr2-acts">${cobrar}${receber}<button class="vr2-del" onclick="delV('${x.id}')" aria-label="Excluir">✕</button></div>
    </div>
  </div>`;
}
function gruposVendas(lista,pref){
  const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const ord=lista.slice().sort((a,b)=>b.data.localeCompare(a.data));
  const meses={};const ordemMes=[];
  for(const x of ord){const mk=x.data.slice(0,7);if(!meses[mk]){meses[mk]=[];ordemMes.push(mk)}meses[mk].push(x)}
  let out='';
  for(const mk of ordemMes){
    const arr=meses[mk];const [ano,mes]=mk.split('-');
    const tot=arr.reduce((s,x)=>s+x.q*x.preco,0);
    const key=pref+mk;const fechado=FECHADOS.has(key);
    out+=`<button class="vr2-mes" onclick="toggleMes('${key}')"><span>${MESES[+mes-1]} ${ano}</span><span class="mut" style="font-weight:600;letter-spacing:0;text-transform:none">${arr.length} · ${R(tot)} ${fechado?'▸':'▾'}</span></button>`;
    if(fechado)continue;
    const dias={};const ordemDia=[];
    for(const x of arr){if(!dias[x.data]){dias[x.data]=[];ordemDia.push(x.data)}dias[x.data].push(x)}
    for(const d of ordemDia)out+=`<div class="vr2-day">${fd(d)}</div>${dias[d].map(rowVenda).join('')}`;
  }
  return out;
}
function listaVendas(){
  if(!S.v.length)return '<div class="empty">Nenhuma venda ainda.</div>';
  const abertas=S.v.filter(x=>!x.pago), pagas=S.v.filter(x=>x.pago);
  let out=abertas.length?gruposVendas(abertas,'a:'):'<div class="empty">Nenhuma venda em aberto.</div>';
  const totP=pagas.reduce((s,x)=>s+x.q*x.preco,0);
  out+=`<button class="vr2-mes" onclick="togglePagas()" style="margin-top:16px"><span>Vendas pagas</span><span class="mut" style="font-weight:600;letter-spacing:0;text-transform:none">${pagas.length} · ${R(totP)} ${PAGAS_OPEN?'▾':'▸'}</span></button>`;
  if(PAGAS_OPEN&&pagas.length)out+=gruposVendas(pagas,'p:');
  return out;
}

function historicoCli(c){
  const vs=S.v.filter(x=>x.cid===c.id).slice().sort((a,b)=>b.data.localeCompare(a.data));
  if(!vs.length)return '<div class="ch-vazio">Ainda não comprou nada.</div>';
  const grupos={};
  for(const x of vs){
    const k=x.nome+(x.sabor?' · '+x.sabor:'');
    if(!grupos[k])grupos[k]={nome:k,q:0,valor:0};
    grupos[k].q+=x.q;grupos[k].valor+=x.q*x.preco;
  }
  const linhas=Object.values(grupos).sort((a,b)=>b.valor-a.valor).map(g=>
    `<div class="ch-row"><div class="ch-p">${esc(g.nome)} <span class="ch-d">· ${g.q} un.</span></div><div class="ch-v"><b>${R(g.valor)}</b></div></div>`
  ).join('');
  const total=vs.reduce((s,x)=>s+x.q*x.preco,0);
  const aberto=vs.reduce((s,x)=>s+saldoDe(x),0);
  const resumo=aberto>0.005
    ? `<div class="ch-sum">Falta pagar <b class="ch-falta">${R(aberto)}</b></div>`
    : `<div class="ch-sum">Tudo pago · total <b>${R(total)}</b></div>`;
  return `<div class="ch-box">${linhas}${resumo}</div>`;
}

let ANIMAR=false,T_ANIM=null,RAF=false;
let LAST_APP='',LAST_NAV='';
function animarProximo(){ANIMAR=true;clearTimeout(T_ANIM);T_ANIM=setTimeout(()=>{ANIMAR=false},900)}
function setTab(t){animarProximo();tab=t;render();scrollTo(0,0)}
function setSub(s){animarProximo();sub=s;render()}
function setPer(p){animarProximo();per=p;render()}

function countUps(root){
  root.querySelectorAll('[data-val]').forEach(el=>{
    const alvo=parseFloat(el.getAttribute('data-val'))||0;
    const t0=performance.now(),dur=750;
    const fmt=v=>R(v);
    function passo(t){
      const k=Math.min(1,(t-t0)/dur);
      const e=1-Math.pow(1-k,3);
      el.textContent=fmt(alvo*e);
      if(k<1)requestAnimationFrame(passo);
    }
    el.textContent=fmt(0);
    requestAnimationFrame(passo);
  });
}
function renderAgora(){
  const nav=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="setTab('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
  if(nav!==LAST_NAV){$('#nav').innerHTML=nav;LAST_NAV=nav}
  const html=READY||!REMOTE?window['view_'+tab]():'<div class="empty">Carregando dados…</div>';
  const app=$('#app');
  if(html!==LAST_APP){
    const medidorAtual=app.querySelector('.home-score-ring');
    const pctAnterior=medidorAtual?Math.max(0,Math.min(100,parseFloat(medidorAtual.style.getPropertyValue('--score'))||0)):null;
    app.innerHTML=html;
    LAST_APP=html;
    if(ANIMAR)countUps(app);
    const ring=app.querySelector('.home-score-ring');
    if(ring){
      const pctAlvo=Math.max(0,Math.min(100,parseFloat(ring.style.getPropertyValue('--score'))||0));
      const dot=ring.querySelector('.home-score-dot');
      const numero=ring.querySelector('.home-score-number');
      const posicao=p=>({x:(88-72*Math.cos(Math.PI*p/100)).toFixed(2),y:(82-72*Math.sin(Math.PI*p/100)).toFixed(2)});
      if(pctAnterior!==null&&pctAnterior!==pctAlvo){
        const inicio=posicao(pctAnterior),fim=posicao(pctAlvo);
        ring.style.setProperty('--score',pctAnterior);
        if(dot){dot.setAttribute('cx',inicio.x);dot.setAttribute('cy',inicio.y)}
        if(numero)numero.textContent=Math.round(pctAnterior)+'%';
        requestAnimationFrame(()=>{
          ring.style.setProperty('--score',pctAlvo);
          if(dot){dot.setAttribute('cx',fim.x);dot.setAttribute('cy',fim.y)}
          if(numero)numero.textContent=pctAlvo+'%';
        });
      }
    }
  }
  app.classList.toggle('enter',ANIMAR);
}
function render(){
  if(!$('#nav')||RAF)return;
  RAF=true;
  requestAnimationFrame(()=>{RAF=false;renderAgora()});
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TABELAS={produtos:'p',clientes:'c',vendas:'v',gastos:'d'};

function supabaseStore(){
  return{
    set:async(c,id,d)=>{
      const k=KEY[c],antes=S[k].slice(),i=S[k].findIndex(x=>x.id===id);
      const novo={id,...d};
      if(i<0)S[k].push(novo);else S[k][i]=novo;
      render();
      try{const{error}=await sb.from(c).upsert({id,dados:d});if(error)throw error}
      catch(e){S[k]=antes;render();throw e}
    },
    upd:async(c,id,d)=>{
      const k=KEY[c],antes=S[k].map(x=>({...x})),i=S[k].findIndex(x=>x.id===id);
      const cur=i>=0?S[k][i]:{id};
      const{id:_,...limpo}={...cur,...d};
      if(i>=0)S[k][i]={...cur,...d};
      render();
      try{const{error}=await sb.from(c).upsert({id,dados:limpo});if(error)throw error}
      catch(e){S[k]=antes;render();throw e}
    },
    del:async(c,id)=>{
      const k=KEY[c],antes=S[k].slice();
      S[k]=S[k].filter(x=>x.id!==id);
      render();
      try{const{error}=await sb.from(c).delete().eq('id',id);if(error)throw error}
      catch(e){S[k]=antes;render();throw e}
    }
  };
}
async function carregarTudo(){
  const entradas=Object.entries(TABELAS);
  const resultados=await Promise.all(entradas.map(async([tab,key])=>{
    const{data,error}=await sb.from(tab).select('id,dados');
    if(error){console.error('Erro ao carregar '+tab,error);return null}
    return {key,registros:(data||[]).map(r=>({id:r.id,...r.dados}))};
  }));
  for(const resultado of resultados){
    if(resultado)S[resultado.key]=resultado.registros;
  }
}

async function entrarNoApp(){
  REMOTE=true;ST=supabaseStore();READY=false;
  render();
  await carregarTudo();
  READY=true;animarProximo();render();
  let sincronizacaoPendente=null;
  let sincronizacaoEmAndamento=false;
  async function sincronizarTabela(tabela){
    const key=TABELAS[tabela];
    if(!key)return false;
    const{data,error}=await sb.from(tabela).select('id,dados');
    if(error){console.warn('Falha ao sincronizar '+tabela,error.message);return false;}
    const novos=(data||[]).map(r=>({id:r.id,...r.dados}));
    if(JSON.stringify(S[key])===JSON.stringify(novos))return false;
    S[key]=novos;
    return true;
  }
  async function sincronizarTudoSilencioso(){
    if(sincronizacaoEmAndamento||document.visibilityState==='hidden')return;
    sincronizacaoEmAndamento=true;
    try{
      let mudou=false;
      for(const tabela of Object.keys(TABELAS)){
        if(await sincronizarTabela(tabela))mudou=true;
      }
      if(mudou)render();
    }catch(e){console.warn('Falha na sincronização automática',e);}
    finally{sincronizacaoEmAndamento=false;}
  }
  sb.channel('smpodsp-tempo-real')
    .on('postgres_changes',{event:'*',schema:'public'},(payload)=>{
      clearTimeout(sincronizacaoPendente);
      sincronizacaoPendente=setTimeout(async()=>{
        const tabela=payload&&payload.table;
        if(TABELAS[tabela]){
          if(await sincronizarTabela(tabela))render();
        }else{
          await sincronizarTudoSilencioso();
        }
      },180);
    })
    .subscribe((status,error)=>{
      console.log('Status da sincronização em tempo real:',status,error||'');
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
        console.warn('Realtime indisponível; a verificação automática continuará ativa.');
      }
    });
  // Rede de segurança: se o Realtime não estiver habilitado no Supabase,
  // confere o banco periodicamente para não deixar os aparelhos dessincronizados.
  setInterval(sincronizarTudoSilencioso,5000);
  window.addEventListener('focus',sincronizarTudoSilencioso);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible')sincronizarTudoSilencioso();
  });
  const sair=document.createElement('div');
  sair.className='sair';
  sair.innerHTML='<button class="sm" id="sairbtn">Sair</button>';
  document.querySelector('main').appendChild(sair);
  $('#sairbtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
}
